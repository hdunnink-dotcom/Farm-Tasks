kind = "mobile"
previewPath = "/mobile/"
title = "Farm & Orchard Planner Mobile"
description = "A touch-first companion for the shared Farm & Orchard Planner. It gives orchard and pasture work a fast, tappable daily checklist and stays aligned with the web planner and Google Sheet."
version = "1.0.0"
id = "artifacts/farm-planner-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20479

[services.development]
run = "pnpm --filter @workspace/farm-planner-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/farm-planner-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/farm-planner-mobile", "run", "serve" ]

[services.env]
PORT = "20479"
BASE_PATH = "/mobile/"
